name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CALLBACK_KEYSTORE_BASE64: ${{ secrets.CALLBACK_KEYSTORE_BASE64 }}
      CALLBACK_KEYSTORE_PASSWORD: ${{ secrets.CALLBACK_KEYSTORE_PASSWORD }}
      CALLBACK_KEY_ALIAS: ${{ secrets.CALLBACK_KEY_ALIAS }}
      CALLBACK_KEY_PASSWORD: ${{ secrets.CALLBACK_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate signing secrets
        run: |
          set -euo pipefail
          missing=()
          [ -z "${CALLBACK_KEYSTORE_BASE64:-}" ] && missing+=("CALLBACK_KEYSTORE_BASE64")
          [ -z "${CALLBACK_KEYSTORE_PASSWORD:-}" ] && missing+=("CALLBACK_KEYSTORE_PASSWORD")
          [ -z "${CALLBACK_KEY_ALIAS:-}" ] && missing+=("CALLBACK_KEY_ALIAS")
          [ -z "${CALLBACK_KEY_PASSWORD:-}" ] && missing+=("CALLBACK_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required repository secrets: ${missing[*]}"
            echo "Add all four secrets under Settings → Secrets and variables → Actions (see docs/CI.md)."
            exit 1
          fi

      - name: Decode release keystore
        run: |
          set -euo pipefail
          KEYSTORE_PATH="${RUNNER_TEMP}/release.jks"
          echo "${CALLBACK_KEYSTORE_BASE64}" | base64 -d > "${KEYSTORE_PATH}"
          echo "CALLBACK_KEYSTORE_PATH=${KEYSTORE_PATH}" >> "${GITHUB_ENV}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble release APK
        run: ./gradlew assembleRelease

      - name: Verify signed APK
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          if [ -z "${APK}" ]; then
            echo "::error::No release APK found under app/build/outputs/apk/release"
            exit 1
          fi
          echo "APK_PATH=${APK}" >> "${GITHUB_ENV}"
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -1)
          if [ -z "${APKSIGNER}" ]; then
            echo "::error::apksigner not found under ANDROID_HOME/build-tools"
            exit 1
          fi
          "${APKSIGNER}" verify --print-certs "${APK}"

      - name: Compute SHA-256 checksum
        run: |
          set -euo pipefail
          SHA256_FILE="${APK_PATH}.sha256"
          sha256sum "${APK_PATH}" | tee "${SHA256_FILE}"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: callback-release-apk
          path: |
            ${{ env.APK_PATH }}
            ${{ env.APK_PATH }}.sha256

      - name: Remove keystore
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/release.jks"
